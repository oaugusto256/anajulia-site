name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19; bump deliberately
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Analytics channel attribution
        run: pnpm check:channel

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      # No secrets needed: reviews and analytics are optional at build time.
      # VERCEL_ENV is unset here, so draft topic pages are served and checked
      # for noindex / sitemap / llms.txt leakage like on a preview.
      - name: SEO checks against the production build
        run: |
          pnpm start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000 && break; sleep 1; done
          pnpm check:seo
